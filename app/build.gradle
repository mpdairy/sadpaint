plugins { id 'com.android.application' }

android {
    namespace 'dev.tilesmile'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.tilesmile.pentest'
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName '0.9.0'
        testInstrumentationRunner 'dev.tilesmile.PerfInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packaging {
        resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        jniLibs.pickFirsts += ['lib/*/libc++_shared.so']
    }
}
dependencies {
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.5.4.4') {
        // Unused legacy permission/storage/debug helpers no longer on Maven Central.
        exclude group: 'pub.devrel', module: 'easypermissions'
        exclude group: 'com.tencent', module: 'mmkv'
        exclude group: 'com.jakewharton.hugo.fix', module: 'hugo-annotations'
    }
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'
    testImplementation 'junit:junit:4.13.2'
}
